[project]
name = "vggt_mamba"
version = "0.0.1"
description = "Linear-scaling, sequential-video 3D reconstruction via Mamba-2 world-model state. CVPR submission."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Raghav Surya" }]

# Core ML + geometry stack.
# torch / mamba-ssm / causal-conv1d intentionally left to a custom install
# (see README.md) — Blackwell sm_120 needs torch>=2.5 + source builds for
# the SSM kernels. uv pip-resolving them here causes wheel-availability
# headaches.
dependencies = [
    "einops>=0.8.0",
    "numpy>=1.26,<2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pillow>=10.0",
    "opencv-python>=4.10",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "rich>=13.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.17",
    "tensorboard>=2.16",
    "huggingface-hub>=0.24",
    "transformers>=4.44",
    "timm>=1.0",
    "safetensors>=0.4",
    "rerun-sdk>=0.18",
    "open3d>=0.18",
    "trimesh>=4.4",
    "plyfile>=1.0",
    "iopath>=0.1.10",
    "pyyaml>=6.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vggt_mamba"]

[tool.uv]
# Lock independent of CUDA wheels; we install torch separately.
no-binary-package = []

[tool.uv.sources]
# placeholder — to add VGGT / V-JEPA / Mamba via editable installs later

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
