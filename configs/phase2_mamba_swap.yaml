# Phase 2 — Mamba-2 aggregator vs transformer baseline.
# Encoder fixed to DINOv3 (Phase 1 winner). Aggregator swap is the variable.

encoder: dinov3
aggregator: mamba         # "attention" reproduces the Phase 1 DINOv3 baseline
d_state: 128              # Mamba-2 SSM state size (state-capacity sweep knob)
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 4
  stride_train: 8
  stride_eval: 32
  depth_max_m: 8.0

model:
  n_xfm_layers: 4

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 4000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

loss:
  consistency_weight: 0.1
  consistency_samples: 1024

output_dir: experiments/phase2_mamba_swap
