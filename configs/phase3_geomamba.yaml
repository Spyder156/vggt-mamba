# Phase 3 — full GeoMamba.
# DINOv3 frozen encoder + per-frame self-attn refine + summary tokens →
# bidirectional Mamba-2 → multi-task heads (camera, pointmap, optional tracks).
# Trained at N=16 with frame_stride=10 for real multi-view signal.

encoder: dinov3
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8            # 16 OOMs on 5070 Ti at 512x512; bump to 16 once on H100
  stride_train: 8
  stride_eval: 32
  frame_stride: 10
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4      # 6 OOMs on consumer GPU; H100 budget supports 12
  n_summary_tokens: 4
  n_xfm_layers: 6
  d_state: 128
  bidirectional: true
  track_enabled: false        # tracks add cost; not needed for the first run
  head_hidden: 192            # narrower DPT to save VRAM

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  mvc_samples: 1024

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 4000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_geomamba
