# TerraWM-D photometric retrain — inversion fix.
#
# Drift-blind check (2026-06-04) confirmed the geometric render-vs-current
# channel ACTIVELY INVERTS with drift:
#   β_disp_geom = -2.18 (95% CI [-2.99, -1.38]) after controlling for coverage
# Photometric loss is the primary fix. ColorHead reads voxel features → RGB,
# supervised against current frame's RGB. photometric_pose_gradient=true lets
# the (hypothesized correct-direction) photometric signal flow back into the
# pose head — replacing the bad geometric signal.
#
# Pre-registered gate (LOCKED):
#   β_disp_photo ≥ +1.0, 95% CI excludes 0  (opposite sign from geometric)
#   strict cov>0.99 sanity ratio (high/low) > 1.3, p<0.05
#   tier4/pose_err_corr_with_photo_mismatch_rel crosses neg→pos within 2000 steps
#   scene-state ablation: post-reset Δt ≥ 0.10m (baseline 0.137m, 27% margin)
#   ColorHead not collapsed: patch-RGB std > 0.01
#
# Warm-start: from pure1 ckpt step 8000. All non-photometric weights inherited.
# ColorHead is fresh. Optimizer state NOT restored (fresh AdamW so new gradient
# direction can adapt freely, not locked to inverted-pose moment estimates).

encoder: dinov3
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8
  stride_train: 8
  stride_eval: 16
  frame_stride: 10
  randomize_stride: [1, 1]
  depth_max_m: 8.0
  train_seqs:
    - rgbd_dataset_freiburg3_sitting_xyz
    - rgbd_dataset_freiburg1_room
  eval_seqs: null

model:
  n_intraframe_layers: 4
  voxel_bounds: [-4.0, -4.0, -2.0, 4.0, 4.0, 8.0]
  voxel_resolution: [64, 64, 64]
  voxel_feature_dim: 32
  n_render_samples: 64
  render_near: 0.1
  render_far: 8.0
  bootstrap_hidden: 128
  bootstrap_max_depth: 10.0
  pose_head_hidden: 256
  pose_max_dt: 1.0
  pose_max_dq: 0.5
  unwritten_mask_threshold: 0.001
  use_write_confidence: true
  write_confidence_hidden: 64
  differentiable_write_geometry: true
  # === PHOTOMETRIC ===
  use_photometric: true              # ColorHead on, predicts per-patch + dense RGB
  photometric_hidden: 64
  photometric_pose_gradient: true    # render2 pose NOT detached → photo grad reaches pose head

loss:
  w_render_l1: 1.0
  w_render_log: 0.5
  w_bootstrap: 1.0
  w_pose: 1.0
  w_mvc: 0.1
  mvc_samples: 512
  pose_scale_invariant: true
  pose_w_scale_inv: 1.0
  pose_w_cos: 1.0
  pose_w_rot: 1.0
  pose_w_fov: 0.1
  pose_tracking: false
  # Photometric L1 loss — matched order of magnitude to w_render_l1.
  w_photometric: 1.0

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 8000                  # match pure1 baseline length
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  diag_every: 100
  img_every: 500
  tier4_every: 50              # tier-4 diagnostics every 50 steps (live cure-monitor)
  tensorboard: true
  precision: bfloat16

output_dir: experiments/phase4_terrawm_d_seed0_photometric
