# Phase 3 streaming + world-model regularizer.
# Same as phase3_streaming_n8.yaml plus a JEPA-style next-latent prediction
# objective. EMA-target copies of the intraframe + summary encoders provide
# stable targets; predictor head learns state_t -> next-frame summary tokens.
#
# Hypothesis (Dreamer/RSSM): training the state to PREDICT future observations
# forces it to encode the 3D scene + ego-motion, which our reconstruction-only
# losses never directly rewarded.

encoder: dinov3
aggregator: mamba
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8
  stride_train: 8
  stride_eval: 16
  frame_stride: 10
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 4
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  dense_residual_to_patches: true       # keep patch residual — we're not removing the dense bandwidth path
  predict_next_latent: true             # <-- the new objective
  ema_momentum: 0.99

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 0.5                            # weight on the world-model regularizer
  mvc_samples: 1024

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_predict
