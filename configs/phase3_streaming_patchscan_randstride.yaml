# Experiment (1) — predictor under motion magnitude.
# Random frame_stride per training window: uniform in [5, 30].
# Hypothesis: at fixed frame_stride=10 the predictor learns near-trivial
# "copy state" (inter-frame motion ~cm-scale on sitting sequences). Randomizing
# 5-30 forces it to actually model ego-motion across a 6x range of frame deltas.
#
# Pre-registered thresholds (active-scene mean ATE on held-out walking_xyz +
# walking_halfsphere + sitting_xyz, current baseline = 0.323 m):
#   ≤ 0.15 m  → strong positive: dual-channel architecture sound, undertrained
#   0.15–0.25 → partial: pursue K_dyn=8 next
#   > 0.25 m  → negative: K_dyn bump mandatory, dynamic-channel design suspect
#
# Variance stop-rule: if 3-seed std on active-scene mean ATE > 0.05 m,
# run more seeds before declaring (no "basically in bucket X" reasoning).
#
# Eval pipeline is identical to patchscan — streaming inference is per-frame
# at inference; randomize_stride only changes the training motion distribution.

encoder: dinov3
aggregator: mamba
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8
  stride_train: 8
  stride_eval: 16
  frame_stride: 10              # eval default
  randomize_stride: [5, 30]     # <<< the change
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 8
  n_summary_dynamic: 4
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  dense_residual_to_patches: false
  predict_next_latent: true
  ema_momentum: 0.99
  cross_frame_target: patch

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 0.5
  mvc_samples: 1024

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_patchscan_randstride_seed0
