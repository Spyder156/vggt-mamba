# TerraWM-Linear V2 production config (Path A).
#
# Updates vs V1 (20k run on this config produced flat depth + frozen pose):
#   - Add multi-view 3D consistency loss (cheat-pose Flavor A: back-project
#     predicted depth via GT pose, average pairwise Chamfer between frames).
#   - Reweight: pose terms x10 so they actually compete with the ~1M
#     depth-pixel comparisons per batch.
#   - Swap held-out eval from fr3/walking_xyz (dynamic humans, OOD) to
#     fr3/sitting_static (static scene, in-distribution).

experiment:
  name: terrawm_linear_v2
  output_dir: experiments/terrawm_linear_v2
  seed: 42

model:
  img_size: 512
  d_enc: 1024                    # DINOv3 ViT-L/16
  d_model: 768
  n_heads: 12
  n_latents: 512
  n_write_blocks: 4
  n_decode_blocks: 2
  encoder_repo: facebook/dinov3-vitl16-pretrain-lvd1689m
  freeze_encoder: true
  max_frames: 64
  pose_supervision_mode: predicted   # "predicted" | "gt_replace"

data:
  data_root: /workspace/datasets/tum_rgbd
  n_frames: 4
  stride: 8
  frame_stride: 10
  randomize_stride: [5, 15]
  img_size: 512
  depth_max_m: 8.0
  num_workers: 4
  batch_size: 1

train:
  n_steps: 20000
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  grad_clip: 1.0
  log_every: 50
  eval_every: 2000
  ckpt_every: 2000
  use_bf16: true

eval:
  seq: rgbd_dataset_freiburg3_sitting_static
  n_frames: 16

loss:
  w_trans: 10.0                  # pose terms x10 — they were ~drowned by depth-pixel count
  w_quat:  10.0
  w_fov:   1.0
  w_depth: 1.0                   # L1 on normalized depth (valid pixels)
  w_3d:    5.0                   # multi-view Chamfer (back-projected through GT pose)
  n_3d_samples: 512              # points sampled per frame for Chamfer
