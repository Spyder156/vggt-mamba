# Experiment 2 — anchor-pool re-grounding (MVP).
#
# Architecture: 1b backbone (K_total=12, K_dyn=8, patchscan, motion-weighted
# pred loss) + AnchorPool re-grounding module on top.
#
# Training: freeze the 1b backbone, train only the anchor pool's correction
# MLP. N=32 windows so accumulated drift within a window is non-trivial and
# the anchor pool gets exercised. Load from the 1b ckpt as a warm start.
#
# Pre-registered (locked, see conversation 2026-05-24):
#   Primary verdict (translation):
#     Piecewise log-log slope of RPE_trans vs δ, on 3 active-scene held-out seqs.
#     Baseline 1b (from rpe_growth_1b.json):
#       slope δ=1→10 = 0.27 / 0.40 / 0.50
#       slope δ=10→100 = 0.58 / 0.53 / 0.57 (the accumulation regime)
#     Strong positive: slope δ=10→100 ≤ 0.20 AND δ=1→10 within ±0.10 of baseline
#                      AND per-seq RPE@100 ≤ 50% of baseline
#     Partial: slope δ=10→100 in 0.20–0.35 OR RPE@100 reduction in 20–50%
#     Negative: slope δ=10→100 ≥ 0.35 AND RPE@100 reduction < 20%
#     Pathological: slope δ=1→10 ALSO drops substantially → investigate (means
#       something other than re-grounding changed; the MVP shouldn't move
#       per-frame noise)
#
#   Secondary verdict: active-scene mean ATE-Sim3 RMSE.
#     If slope δ=10→100 ≤ 0.20 AND ATE in 0.18–0.25 m → STRONG POSITIVE
#       (drift bound at offset; expected best case for feedforward correction)
#     ATE going to zero would require global optimization we're not doing.
#
#   Tertiary: static-scene guardrail (mean ATE ≤ 0.05 m).
#   Tertiary: rotation slopes — measured, NOT verdicted.
#
#   Variance stop-rule: same as 1a/1b (3-seed std > 0.05 m → run more seeds).
#
# Known limitation we've already named (pre-registered as a positive outcome):
#   Anchors are placed through the (drifty) coarse pose, so they reflect drift
#   at write time. Re-observing pulls toward a stable-but-offset reference.
#   "slope drops, ATE plateaus at offset" is the mechanism working as designed.

encoder: dinov3
aggregator: mamba
seed: 0

# Load from 1b ckpt as warm start.
load_ckpt: experiments/phase3_streaming_patchscan_1b_seed0/dinov3_mamba/ckpt_002000.pt
freeze_backbone: true            # only train new anchor pool params

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 32                   # WAS 8 — longer windows so anchor pool gets exercised
  stride_train: 32
  stride_eval: 32
  frame_stride: 10
  randomize_stride: [10, 30]     # carry forward from 1a/1b
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 12
  n_summary_dynamic: 8
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  dense_residual_to_patches: false
  predict_next_latent: true
  ema_momentum: 0.99
  cross_frame_target: patch
  use_anchor_pool: true          # <<< the experiment 2 change
  n_anchors: 32
  n_anchor_writes: 4
  anchor_match_threshold: 0.5

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 0.5
  w_anchor: 0.5                  # consistency loss weight (locked at 0.5)
  anchor_threshold: 0.5          # matched-pair threshold for consistency loss
  mvc_samples: 1024
  pred_loss_weighting: motion_norm

optim:
  lr: 1.0e-4                     # higher than 1b — only new params being trained
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_patchscan_2_seed0
