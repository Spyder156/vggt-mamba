# Phase 3 streaming — DUAL-CHANNEL state.
# K = 8 summary tokens split into K_dyn=4 (dynamic) + K_obs=4 (observation).
#   - dynamic tokens: drive the camera head AND carry the world-model
#     prediction loss (smooth, predictive)
#   - observation tokens: free of the prediction loss, free to specialize
#     for sharp dense-head readout (the no-residual dense head reads ALL K)
#
# Hypothesis (RSSM-style channel split): the combo failure at 0.504 was
# role-conflict in a shared K=4 state — a single bag of 4 tokens cannot be
# simultaneously smooth-for-prediction AND sharp-for-reconstruction. Splitting
# the bag breaks that conflict.
#
# If this recovers depth quality (target: at least matching the bare
# predict-only run at 0.32), it confirms K capacity wasn't the issue — role
# conflict was. If quality stays bad, the dense head genuinely can't reconstruct
# from any K=8 state and we go to Option 2 (read full SSM state matrix).

encoder: dinov3
aggregator: mamba
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8
  stride_train: 8
  stride_eval: 16
  frame_stride: 10
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 8                    # TOTAL K (was 4)
  n_summary_dynamic: 4                   # first 4 = dynamic channel
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  dense_residual_to_patches: false       # force dense to use state
  predict_next_latent: true              # train dynamic channel to be informative
  ema_momentum: 0.99

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 0.5
  mvc_samples: 1024

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_dualchannel
