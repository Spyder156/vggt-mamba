# Phase 2 (corrected) — attention baseline with REAL multi-view inside the window.
# Previous Phase 1 runs used consecutive TUM frames (~0.13s span) where the
# aggregator had no real cross-frame work to do.  frame_stride=10 spreads
# the 4-frame window over ~1.3 seconds of camera motion.

encoder: dinov3
aggregator: attention
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 4
  stride_train: 8
  stride_eval: 32
  frame_stride: 10       # NEW — gap between frames inside a window (30 fps source)
  depth_max_m: 8.0

model:
  n_xfm_layers: 4

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 4000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

loss:
  consistency_weight: 0.1
  consistency_samples: 1024

output_dir: experiments/phase2_real_multiview
