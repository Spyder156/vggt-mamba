# Experiment 2b — anchor-pool re-grounding with FIX (A)+(B) applied.
#
# Diagnosis from exp 2 (negative): correction MLP learned "output ~0" because
# at training time the coarse pose was already accurate (frozen 1b backbone)
# and the consistency loss was a weak signal (w_anchor=0.5 with anc ~0.15).
# Two combined fixes:
#
#   (A) Stronger consistency-loss weight: w_anchor = 0.5 → 5.0 (10×).
#       Forces the MLP to actually minimize anchor reprojection error
#       rather than zero out the correction.
#
#   (B) Training-time cumulative pose noise: σ = 0.10 m per-frame Gaussian
#       drift, accumulated random-walk over the window. After 32 frames,
#       cumulative drift ~ σ × √32 ≈ 0.57 m — comparable to (slightly
#       larger than) the 30 cm inference-time drift we measured. The MLP
#       sees the noisy pose, anchor pool is written with the noisy pose,
#       and the correction MLP learns to use anchors to undo the drift.
#
# The tanh bound (0.10 m translation, small quat perturbation per step) is
# kept — it caps correction magnitude per frame, but the cumulative
# correction over many frames can still recover larger drifts.
#
# Pre-registered verdict: same as exp 2 (locked).
#   Primary: piecewise slope δ=10→100 ≤ 0.20 (strong) / 0.20-0.35 (partial)
#   Secondary: ATE plateau; static guardrail; rotation slopes reported

encoder: dinov3
aggregator: mamba
seed: 0

load_ckpt: experiments/phase3_streaming_patchscan_1b_seed0/dinov3_mamba/ckpt_002000.pt
freeze_backbone: true

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 32
  stride_train: 32
  stride_eval: 32
  frame_stride: 10
  randomize_stride: [10, 30]
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 12
  n_summary_dynamic: 8
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  dense_residual_to_patches: false
  predict_next_latent: true
  ema_momentum: 0.99
  cross_frame_target: patch
  use_anchor_pool: true
  n_anchors: 32
  n_anchor_writes: 4
  anchor_match_threshold: 0.5
  train_pose_noise_std_m: 0.10   # <<< (B) per-frame drift std

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 0.5
  w_anchor: 5.0                  # <<< (A) 10x stronger than exp 2
  anchor_threshold: 0.5
  mvc_samples: 1024
  pred_loss_weighting: motion_norm

optim:
  lr: 1.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_patchscan_2b_seed0
