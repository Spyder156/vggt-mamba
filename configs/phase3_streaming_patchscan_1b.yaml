# Experiment 1b — K_dyn bump from 4 to 8.
# Tests whether the dynamic channel was capacity-limited for translation.
# K_total = 12 (K_dyn=8 + K_obs=4, keeping K_obs unchanged so we isolate the
# dynamic-capacity variable). All other knobs identical to 1a.
#
# Pre-registered (locked, same thresholds as 1a):
#   metric: active-scene mean ATE-Sim3 RMSE on sitting_xyz + walking_xyz +
#           walking_halfsphere
#   baseline reference: 0.323 m
#   strong positive (motion thread closed): ≤ 0.180 m
#   partial (proceed to 1c longer-N IF rot+trans both moved):  0.180–0.270 m
#   negative (ship-with-limitation, K_dyn-vs-translation diagnosed): > 0.270 m
#   variance stop-rule: 3-seed std > 0.05 m → run more seeds before declaring
#   static guardrail: mean ATE on sitting_static + walking_static ≤ 0.05 m
#
# Lowered prior (per user, post-1a): the original motivation for the motion
# thread was "vary motion → model learns it." Exp 1's apparent rotation
# improvement turned out to be (probably) an easy-case artifact, and 1a's
# corrected design showed near-zero effect on either axis. 1b is a genuine
# open question, not a formality. The hypothesis being tested is now
# narrower: "given the corrected loss signal from 1a, does doubling the
# dynamic-channel capacity unlock translation modeling?"
#
# Decision-tree exits:
#   1b strong positive → STOP motion thread
#   1b shows clear rot+ / trans- split → ship-with-limitation, K_dyn=8 still
#     insufficient → don't run 1c (longer-N doesn't add translation capacity)
#   1b partial with rot+trans both moving → 1c (longer N=16)
#   1b negative → ship-with-limitation; longer-N unlikely to rescue

encoder: dinov3
aggregator: mamba
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8
  stride_train: 8
  stride_eval: 16
  frame_stride: 10
  randomize_stride: [10, 30]    # carry forward from 1a (corrected range)
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 12          # was 8; +4 dynamic
  n_summary_dynamic: 8          # was 4; doubled
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  dense_residual_to_patches: false
  predict_next_latent: true
  ema_momentum: 0.99
  cross_frame_target: patch

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 0.5
  mvc_samples: 1024
  pred_loss_weighting: motion_norm    # carry forward from 1a (locked formula)

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_patchscan_1b_seed0
