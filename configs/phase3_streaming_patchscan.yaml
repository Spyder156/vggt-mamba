# Phase 3 streaming — PATCH-SCAN cross-frame Mamba (Option 2(b)).
# The cross-frame Mamba scan runs on T*P=8192 patch tokens (was T*K=64).
# Summary pool runs AFTER the scan to produce K_dyn-channel summaries for
# the camera + world-model-prediction heads. DPT reads the scanned patches
# directly — no PatchStateCrossAttn, no summary-token bottleneck on dense.
#
# Hypothesis (interface, not capacity): the dense-head bottleneck in
# dualchannel (abs_rel 0.39) was the K-token summary readout, not the
# state's bandwidth. Reading per-patch hidden states from the cross-frame
# scan gives DPT spatially-aligned context.
#
# Pre-registered thresholds (per user):
#   abs_rel ≤ 0.25 -> interface hypothesis confirmed (CVPR paper)
#   0.25 < abs_rel ≤ 0.32 -> partial (state-driven dense partially works)
#   abs_rel > 0.32 -> spatial readout insufficient; go to Option 3
#
# Dual-channel split for camera is preserved. Camera target: keep the
# 0.78 cam_l1 result (or improve it).

encoder: dinov3
aggregator: mamba
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8
  stride_train: 8
  stride_eval: 16
  frame_stride: 10
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 8                    # K total
  n_summary_dynamic: 4                   # K_dyn for camera + predict
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  # PatchStateCrossAttn still constructed (unused in patch mode) — its
  # residual flag has no effect on dense in patch mode.
  dense_residual_to_patches: false
  predict_next_latent: true
  ema_momentum: 0.99
  cross_frame_target: patch              # <<< THE EXPERIMENT

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 0.5
  mvc_samples: 1024

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_patchscan
