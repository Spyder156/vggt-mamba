# Phase 3 streaming — combo of no-residual + world-model prediction.
# Forces dense head to use state (residual off) AND trains state to be
# informative (predict next latent). Decisive test for "state-driven dense"
# hypothesis.
#
# If this recovers depth quality vs the bare no-residual run (which crashed
# to 0.325), it confirms state quality was the bottleneck of no-residual.
# If quality stays bad, dense bandwidth is genuinely architectural and
# needs scene-anchor redesign for v2.

encoder: dinov3
aggregator: mamba
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8
  stride_train: 8
  stride_eval: 16
  frame_stride: 10
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 4
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  dense_residual_to_patches: false       # force dense to use state
  predict_next_latent: true              # make state informative
  ema_momentum: 0.99

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 0.5
  mvc_samples: 1024

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_combo
