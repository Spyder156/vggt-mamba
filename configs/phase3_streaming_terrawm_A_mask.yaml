# Experiment A — force Mamba state load-bearing via aggressive frame masking.
#
# Diagnostic, not a candidate fix. The TerraWM state-ablation showed the
# recurrent state is inert (reset → 2mm output change). Step-1000 and step-2000
# ckpts both show this — the optimizer never engaged with the state.
#
# A's purpose: distinguish OBJECTIVE problem (loss solvable frame-locally so
# optimizer ignores state) from ARCHITECTURAL problem (generic recurrent latent
# cannot hold scene info regardless of objective).
#
# Mechanism: each frame in each 8-frame training window has independent
# probability mask_p of being RGB-zeroed. The encoder sees nothing for masked
# frames — the model must predict their depth + pose from the recurrent state
# (or cross-frame Mamba scan output). mask_p ramps linearly 0.3 → 0.7 over
# training: at step 0 ≈ 2.4 frames masked per window; at step 2000 ≈ 5.6/8
# frames masked. Guaranteed at least 1 visible frame per window (loss stays
# learnable).
#
# PRE-REGISTERED VERDICT (locked before launch):
#   Primary metric: scene-state ablation delta on held-out sitting_xyz,
#     same protocol as TerraWM post-train diag (reset state at frame 200,
#     measure post-reset cam-diff mean over next 50 frames).
#   TerraWM baseline (no masking): 0.00192 m.
#   Strong positive (state load-bearing): ≥ 0.020 m  (~10× baseline)
#   Partial:                              0.005 – 0.020 m
#   Negative (state still inert):         < 0.005 m
#
# SANITY GATE: loss_pred + loss_cam must continue decreasing. If they flatline
#   or NaN, masking is unlearnable and the experiment is INCONCLUSIVE
#   (curriculum endpoint must drop before declaring).
#
# NOT scored on ATE / drift / per-frame RPE. Those are orthogonal to the
# objective-vs-architecture diagnostic A is testing.
#
# DECISION TREE (pre-committed):
#   Strong positive → objective problem confirmed. No D rebuild. Add E
#     (long-horizon photometric/multi-view consistency) for drift.
#   Negative + losses learning → architectural problem confirmed.
#     COMMIT TO D REBUILD (explicit 3D scene memory). Full commitment.
#     No more masking variants. No B (long-horizon prediction — same
#     hypothesis as A, would be redundant). No C-with-bigger-K (folds
#     into D as its depth head).
#   Partial → one attempt at 0.5→0.9 curriculum before deciding.
#   Inconclusive (losses didn't learn) → lower curriculum endpoint, re-run.

encoder: dinov3
aggregator: mamba
seed: 0

load_ckpt: experiments/phase3_streaming_patchscan_1b_seed0/dinov3_mamba/ckpt_002000.pt
freeze_backbone: false

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8
  stride_train: 8
  stride_eval: 16
  frame_stride: 10
  randomize_stride: [10, 30]
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 12
  n_summary_dynamic: 8
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  dense_residual_to_patches: false
  predict_next_latent: true
  ema_momentum: 0.99
  cross_frame_target: patch
  use_anchor_pool: false
  terrawm: true
  terrawm_motion_freqs: 64

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 2.0
  w_vic_var: 1.0
  w_vic_cov: 0.04
  mvc_samples: 1024
  pred_loss_weighting: motion_norm
  mask_frame_prob_schedule: [0.3, 0.7]    # <<< Experiment A
  mask_per_frame_independent: true        # <<< per-frame, not per-window

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_terrawm_A_mask_seed0
