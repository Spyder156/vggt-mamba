# Experiment 1a — properly fixed predictor-under-motion experiment.
# Random frame_stride in [10, 30] (never below baseline, only adds harder cases)
# AND per-pair pred-loss weighting by ego-motion magnitude (median-normalized).
# This isolates "predictor under hard motion" from the easy-case-bias confound
# that contaminated experiment 1 (randstride 5–30).
#
# Pre-registered (locked):
#   metric: active-scene mean ATE-Sim3 RMSE on sitting_xyz + walking_xyz +
#           walking_halfsphere (translation, since Sim3 RMSE post-alignment
#           is pure translation error)
#   baseline reference: 0.323 m
#   strong positive (motion thread closed): ≤ 0.180 m
#   partial (proceed to 1b K_dyn=8): 0.180–0.270 m
#   negative (K_dyn bump mandatory): > 0.270 m
#   variance stop-rule: 3-seed std > 0.05 m → run more seeds before declaring
#   STATIC-SCENE GUARDRAIL: mean ATE on sitting_static + walking_static
#                            must not exceed 0.05 m (current 0.031 m)
#   interpretive lens: report RPE rotation/translation split; prediction is
#     translation moves with rotation. If translation stays stuck while
#     rotation improves, K_dyn=4 is structurally insufficient for translation.
#
# Loss-weighting formula (LOCKED, not tunable):
#   w_pair(b, t) = ‖t_gt(b, t+1) − t_gt(b, t)‖₂ / median over batch
#   loss_pred = mean(w_pair * (predicted_next − target_next)²)

encoder: dinov3
aggregator: mamba
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8
  stride_train: 8
  stride_eval: 16
  frame_stride: 10
  randomize_stride: [10, 30]    # corrected range — never adds easier cases
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 8
  n_summary_dynamic: 4
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  dense_residual_to_patches: false
  predict_next_latent: true
  ema_momentum: 0.99
  cross_frame_target: patch

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 0.5
  mvc_samples: 1024
  pred_loss_weighting: motion_norm    # <<< the experiment 1a change

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_patchscan_1a_seed0
