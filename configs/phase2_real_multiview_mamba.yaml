# Phase 2 (corrected) — Mamba aggregator with REAL multi-view inside the window.
# Mirrors phase2_real_multiview_attn.yaml; only the aggregator differs.

encoder: dinov3
aggregator: mamba
d_state: 128
seed: 0

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 4
  stride_train: 8
  stride_eval: 32
  frame_stride: 10
  depth_max_m: 8.0

model:
  n_xfm_layers: 4

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 4000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

loss:
  consistency_weight: 0.1
  consistency_samples: 1024

output_dir: experiments/phase2_real_multiview
