# TerraWM — CrossJEPA-conditioned predictor + delta-pose head + VICReg regs.
#
# Architectural pivot to a real world-model framing:
#  - The recurrent state is interpreted as SCENE memory (static-scene prior).
#  - The latent predictor is conditioned on GT camera motion between t and t+1.
#    This decouples view-change physics from the state — encoder/state focus
#    on scene structure, predictor handles the camera-relative re-rendering.
#  - The camera head outputs PER-FRAME RELATIVE MOTION (delta translation +
#    delta quaternion) instead of absolute world-from-camera. Bounded, well-
#    conditioned supervision; absolute trajectory recovered at eval by an
#    external integrator (3 floats of running state, outside the recurrence).
#  - VICReg variance + covariance regs on the predictor output prevent the
#    JEPA-style latent collapse failure mode.
#
# Pre-registered primary verdict: PER-FRAME DELTA TRANSLATION RPE.
#   Baseline patchscan_1b per-frame δ=1 trans RPE on 3 active held-out seqs:
#     sitting_xyz 0.064 m  /  walking_xyz 0.088 m  /  walking_halfsphere 0.107 m
#     active mean ≈ 0.086 m
#   Strong positive (per-frame error halved): mean ≤ 0.040 m
#   Partial: 0.040 < mean ≤ 0.065 m
#   Negative: mean > 0.065 m
#
# Secondary: ATE Sim3 RMSE on active scenes (via external delta integrator).
#   ATE depends on cumulative drift; even strong per-frame win may show only
#   modest ATE win without re-grounding. Report, don't verdict.
#
# Diagnostic (must measure to interpret):
#   predictor_dim_std: per-dim std of predictor output. Healthy ≥ 0.5;
#     ≪ 1 means the predictor partially collapsed despite VICReg.
#   scene-state ablation (post-training): swap state from one frame in for
#     another in inference and check whether predictions degrade as expected.
#   camera-motion conditioning sensitivity: vary motion input to predictor
#     by known amounts and confirm predicted z changes.

encoder: dinov3
aggregator: mamba
seed: 0

load_ckpt: experiments/phase3_streaming_patchscan_1b_seed0/dinov3_mamba/ckpt_002000.pt
freeze_backbone: false             # full retrain — TerraWM changes the supervision shape

data:
  root: /workspace/datasets/tum_rgbd
  n_frames: 8
  stride_train: 8
  stride_eval: 16
  frame_stride: 10
  randomize_stride: [10, 30]       # carry from 1a/1b: motion variety in training
  depth_max_m: 8.0

model:
  n_intraframe_layers: 4
  n_summary_tokens: 12
  n_summary_dynamic: 8
  n_xfm_layers: 6
  d_state: 128
  bidirectional: false
  track_enabled: false
  head_hidden: 192
  dense_residual_to_patches: false
  predict_next_latent: true
  ema_momentum: 0.99
  cross_frame_target: patch
  use_anchor_pool: false           # TerraWM is the alternative to the anchor pool
  terrawm: true                    # <<< the experiment
  terrawm_motion_freqs: 64

loss:
  w_pmap_l1: 1.0
  w_pmap_log: 0.5
  w_mvc: 0.1
  w_cam: 1.0
  w_track: 1.0
  w_pred: 2.0                      # WORLD-MODEL SIGNAL IS PRIMARY (was 0.5)
  w_vic_var: 1.0                   # default VICReg γ=1 weighting (don't pre-engineer)
  w_vic_cov: 0.04                  # original VICReg paper ratio (1/25 of inv/var)
  mvc_samples: 1024
  pred_loss_weighting: motion_norm

optim:
  lr: 5.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.95]
  warmup_steps: 200

train:
  steps: 2000
  batch_size: 1
  num_workers: 4
  log_every: 25
  eval_every: 500
  ckpt_every: 1000
  precision: bfloat16

output_dir: experiments/phase3_streaming_terrawm_seed0
